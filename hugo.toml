baseURL = "https://blog.2x.nz/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "二叉树树的博客"
enableRobotsTXT = true
buildDrafts = false
buildFuture = true
buildExpired = false
pagination.pagerSize = 10

[minify]
disableXML = true
minifyOutput = true

[params]
env = "production"
title = "二叉树树的博客"
description = "Protect What You Love."
defaultTheme = "auto"
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowToc = true
TocOpen = false
comments = true

[params.assets]
favicon = "https://q2.qlogo.cn/headimg_dl?dst_uin=2726730791&spec=0"
favicon16x16 = "https://q2.qlogo.cn/headimg_dl?dst_uin=2726730791&spec=0"
favicon32x32 = "https://q2.qlogo.cn/headimg_dl?dst_uin=2726730791&spec=0"
apple_touch_icon = "https://q2.qlogo.cn/headimg_dl?dst_uin=2726730791&spec=0"

[params.homeInfoParams]
Title = "Hi 👋"
Content = "博客一定要能看文章✍️✍️✍️"

[[menu.main]]
identifier = "posts"
name = "文章"
url = "/posts/"
weight = 10

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 20

[[menu.main]]
identifier = "search"
name = "搜索"
url = "/search/"
weight = 30

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.parser.attribute]
block = false
title = false
